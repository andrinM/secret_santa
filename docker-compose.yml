services:
  santa:
    image: caddy:2.8.4-alpine
    container_name: secret-santa
    restart: unless-stopped
    ports:
      - "8088:80"
    env_file: .env
    volumes:
      - ./:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api

  # Wish API, only reachable through Caddy (no port published).
  api:
    image: node:22.11.0-alpine
    container_name: secret-santa-api
    restart: unless-stopped
    command: node /app/server.mjs
    env_file: .env
    environment:
      TZ: Europe/Zurich
    volumes:
      - ./server.mjs:/app/server.mjs:ro
      - ./data:/data
